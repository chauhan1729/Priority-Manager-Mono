# Supabase project config
# Then run: supabase db push   to apply all migrations

project_id = "arpkgbrzjnhiehdjjcdi"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true

# Web Push dispatcher — invoked by pg_cron with the service_role key as Bearer.
# JWT verification stays ON so the endpoint isn't publicly invocable.
[functions.send-web-push]
verify_jwt = true
