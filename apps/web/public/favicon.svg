<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Notebook background -->
  <rect x="4" y="2" width="24" height="28" rx="3" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <!-- Spine line -->
  <line x1="10" y1="2" x2="10" y2="30" stroke="#BFDBFE" stroke-width="1.5"/>
  <!-- Spiral rings -->
  <circle cx="10" cy="8" r="1.5" fill="#93C5FD"/>
  <circle cx="10" cy="14" r="1.5" fill="#93C5FD"/>
  <circle cx="10" cy="20" r="1.5" fill="#93C5FD"/>
  <circle cx="10" cy="26" r="1.5" fill="#93C5FD"/>
  <!-- Checkmark lines (tasks) -->
  <line x1="14" y1="11" x2="24" y2="11" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="16" x2="24" y2="16" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="21" x2="20" y2="21" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Check mark -->
  <polyline points="14,8 16,10 20,6" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
