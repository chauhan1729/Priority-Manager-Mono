<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Priority Manager</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #1e293b;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .card {
        text-align: center;
        padding: 2rem;
        max-width: 22rem;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 1rem 0 0.25rem;
      }
      p {
        color: #64748b;
        font-size: 0.9rem;
        line-height: 1.5;
        margin: 0;
      }
      button {
        margin-top: 1.25rem;
        border: 0;
        background: #2563eb;
        color: #fff;
        padding: 0.6rem 1.25rem;
        border-radius: 0.6rem;
        font-size: 0.9rem;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="Priority Manager" />
      <h1>You're offline</h1>
      <p>
        This page isn't available without a connection. Any changes you've made are saved and will
        sync automatically once you're back online.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
